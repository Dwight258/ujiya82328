<!DOCTYPE html>
<html id="container">

<head>
	<meta charset="UTF-8">
	<title>// どの数でも82328にする装置(仮名称) //</title>
	<meta name="viewport" content="width=device-width,user-scalable=0">
	<meta name="description" content="数字うじや化装置">
	<style>
		html {
			text-align: center;
			background: #fbc9d4;
			color: #412300;
			transition: 1s ease;
			font-family: sans-serif;
			word-break: break-all;
		}

		html[numbers=""] {
			background: #81d6fc;
			color: #002b41;
		}

		head {
			display: block;
			text-align: center;
			padding: 3em 0 2em;
		}

		title {
			display: block;
			font-weight: 700;
			font-size: 2em;
			margin: 0.67em;
			line-height: 45px;

		}

		meta[name="description"] {
			display: block;
			margin: 1em 0;
		}

		meta[name="description"]:after {
			content: attr(content);
		}

		body {
			margin: 0;
			padding: 0 0 100px;
		}

		a {
			color: #0080ff;
			text-decoration: none;
		}

		input {
			outline: 0;
			font-size: 20px;
			line-height: 26px;
			text-align: center;

			padding: 8px 12px;
			border: 0;
			width: 80%;
			max-width: 300px;
			-webkit-appearance: none;
		}

		#makomo {
			font-size: 24px;
			font-family: "Comic Sans MS", script;
			padding: 40px 10px 100px;

		}

		footer {
			padding: 320px 0;
			font-size: .8em;
			font-family: "Comic Sans MS", script;
			text-shadow: 0 1px 1px rgba(0, 0, 0, .2);
		}

		footer p {
			opacity: 0.5;
			padding: 20px 0;
		}

		footer a {
			margin: 0.5em;
			color: inherit;
		}
	</style>
</head>

<body>
	<input id="kurina" placeholder="任意の数字を入力" type="number">
	<div id="makomo"></div>

	<footer>
		<p>Source code</p>
		<a href="https://github.com/itorr/homo">GitHub</a>
		<a href="https://weibo.com/1197780522/IBBhqjdbT">Weibo</a>
		<a href="https://lab.magiconch.com/">Lab.</a>
	</footer>

	<script src="sanie.js"></script>
	<script>
		kurina.oninput = _ => {
			const numbers = kurina.value === '' ? '' : Number(kurina.value);
			makomo.innerHTML = numbers + ' = <big>' + obeya(numbers) + '</big>';
			container.setAttribute('numbers', numbers);
		};

		kurina.oninput();
	</script>
</body>

</html>
