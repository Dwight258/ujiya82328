<!DOCTYPE html>
<html id="container">

<head>
	<meta charset="UTF-8">
	<title>どんな数でもうじや化させるツール</title>
	<meta name="viewport" content="width=device-width,user-scalable=0">
	<meta name="description" content="数字うじや化装置">
	<link rel="stylesheet" href="kurina.css">
</head>

<body>
	<input id="kurina" placeholder="好きな数字を入力" type="number">
	<div id="makomo"></div>

	<footer>
		<p>Source code</p>
		<a href="https://github.com/Dwight258/ujiya82328">GitHub</a>
	</footer>

	<script src="sanie.js"></script>
	<script>
		kurina.oninput = _ => {
			const numbers = kurina.value === '' ? '' : Number(kurina.value);
			makomo.innerHTML = numbers + ' = <big>' + obeya(numbers) + '</big>';
			container.setAttribute('numbers', numbers);
		};

		kurina.oninput();
	</script>
</body>

</html>
